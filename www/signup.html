<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriUrbanAI | Create Account</title>
  <link rel="stylesheet" href="signup_theme.css">
</head>

<body>
  <div class="auth-container">
    <div class="form-box">
      <!-- Logo Section -->
      <div class="logo-section">
        <div class="logo-icon">🌾</div>
        <h1 class="logo-text">AgriUrbanAI</h1>
        <p class="logo-tagline">Smart Agriculture & Urban Planning</p>
      </div>

      <h2>Create Your Account</h2>
      <p style="text-align: center; color: #7f8c8d; margin: 1rem 0 2rem;">Join AgriUrbanAI and revolutionize your
        farming or urban planning experience.</p>

      <!-- Signup Form -->
      <form id="signup-form" class="form active">

        <!-- SECTION 1: ACCOUNT DETAILS -->
        <div class="form-section-clean">
          <h3 class="section-header">Account Basics</h3>

          <div class="form-row">
            <input type="text" id="signup-fullname" placeholder="Full Name" required>
            <input type="tel" id="signup-phone" placeholder="Phone Number">
          </div>

          <input type="email" id="signup-email" placeholder="Email Address" required>

          <div class="form-row">
            <input type="password" id="signup-password" placeholder="Password" required minlength="6">
            <input type="password" id="signup-confirm" placeholder="Confirm Password" required minlength="6">
          </div>
        </div>

        <!-- SECTION 2: ROLE -->
        <div class="form-section-clean">
          <h3 class="section-header">Role</h3>
          <select id="signup-role" required>
            <option value="" disabled selected>Select Your Role</option>
            <option value="farmer">Farmer</option>
            <option value="city_planner">City Planner</option>
          </select>
        </div>

        <!-- Farming Details (Hidden by default, shown via JS) -->
        <!-- Farming Details (Hidden by default, shown via JS) -->
        <div id="farmer-fields" style="display: none; margin-bottom: 2rem;">
          <div class="form-row">
            <input type="text" id="signup-crop-type" placeholder="Crop Type">
            <input type="text" id="signup-land-area" placeholder="Land Area (in acres)">
          </div>
        </div>

        <!-- Terms -->
        <div class="terms-container">
          <label class="terms-label">
            <input type="checkbox" id="signup-terms" required>
            <span>I agree to the Terms & Privacy Policy</span>
          </label>
        </div>

        <button type="submit" class="btn btn-signup">Create Account</button>

        <p class="switch">Already have an account?
          <a href="loginAU.html">Login here</a>
        </p>

        <!-- Error Messages -->
        <div id="signup-errors" class="error-messages" style="display: none;"></div>
      </form>
    </div>
  </div>

  <script src="signup.js"></script>
</body>

</html>
